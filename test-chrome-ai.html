<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrome AI APIs Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .test-result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
      .info {
        background-color: #d1ecf1;
        border: 1px solid #bee5eb;
        color: #0c5460;
      }
      button {
        padding: 10px 15px;
        margin: 5px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      #results {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Chrome AI APIs Test</h1>

    <div class="test-result info">
      <h3>📋 Instructions</h3>
      <p>This page tests if Chrome's built-in AI APIs are available.</p>
      <p>If they're not working, you need to enable the Chrome flags.</p>
    </div>

    <button onclick="testChromeAI()">Test Chrome AI APIs</button>
    <button onclick="testPromptAPI()">Test Prompt API</button>
    <button onclick="testSummarizerAPI()">Test Summarizer API</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
      function addResult(message, type = "info") {
        const resultsDiv = document.getElementById("results");
        const resultDiv = document.createElement("div");
        resultDiv.className = `test-result ${type}`;
        resultDiv.textContent = message;
        resultsDiv.appendChild(resultDiv);
        console.log(message);
      }

      function clearResults() {
        document.getElementById("results").innerHTML = "";
      }

      function testChromeAI() {
        addResult("=== TESTING CHROME AI APIs ===", "info");

        // Test navigator.ai
        if (navigator.ai) {
          addResult("✅ navigator.ai is available", "success");

          // Test specific APIs
          if ("prompt" in navigator.ai) {
            addResult("✅ navigator.ai.prompt is available", "success");
          } else {
            addResult("❌ navigator.ai.prompt is NOT available", "error");
          }

          if ("summarizer" in navigator.ai) {
            addResult("✅ navigator.ai.summarizer is available", "success");
          } else {
            addResult("❌ navigator.ai.summarizer is NOT available", "error");
          }

          if ("writer" in navigator.ai) {
            addResult("✅ navigator.ai.writer is available", "success");
          } else {
            addResult("❌ navigator.ai.writer is NOT available", "error");
          }
        } else {
          addResult("❌ navigator.ai is NOT available", "error");
          addResult("You need to enable Chrome flags:", "error");
          addResult("1. Go to chrome://flags/", "error");
          addResult("2. Enable: #prompt-api-for-gemini-nano", "error");
          addResult("3. Enable: #optimization-guide-on-device-model", "error");
          addResult("4. Restart Chrome", "error");
        }

        // Test window.ai
        if (window.ai) {
          addResult("✅ window.ai is available", "success");

          if ("languageModel" in window.ai) {
            addResult("✅ window.ai.languageModel is available", "success");
          } else {
            addResult("❌ window.ai.languageModel is NOT available", "error");
          }
        } else {
          addResult("❌ window.ai is NOT available", "error");
        }

        // Test Chrome version
        const userAgent = navigator.userAgent;
        const chromeMatch = userAgent.match(/Chrome\/(\d+)/);
        if (chromeMatch) {
          const chromeVersion = parseInt(chromeMatch[1]);
          addResult(`Chrome version: ${chromeVersion}`, "info");
          if (chromeVersion < 120) {
            addResult("⚠️ Chrome AI APIs require Chrome 120+", "error");
          }
        }
      }

      async function testPromptAPI() {
        addResult("=== TESTING PROMPT API ===", "info");

        if (!navigator.ai || !navigator.ai.prompt) {
          addResult("❌ Prompt API not available", "error");
          return;
        }

        try {
          addResult("Testing navigator.ai.prompt...", "info");
          const result = await navigator.ai.prompt("Hello, how are you?");
          addResult(`✅ Prompt API works! Result: ${result}`, "success");
        } catch (error) {
          addResult(`❌ Prompt API failed: ${error.message}`, "error");
        }
      }

      async function testSummarizerAPI() {
        addResult("=== TESTING SUMMARIZER API ===", "info");

        if (!navigator.ai || !navigator.ai.summarizer) {
          addResult("❌ Summarizer API not available", "error");
          return;
        }

        try {
          addResult("Testing navigator.ai.summarizer...", "info");
          const testText =
            "Eric Clapton is a famous guitarist who played with Cream and Derek and the Dominos. He is known for songs like Layla and Tears in Heaven.";
          const result = await navigator.ai.summarizer.summarize({
            text: testText,
            maxLength: 50,
          });
          addResult(`✅ Summarizer API works! Result: ${result}`, "success");
        } catch (error) {
          addResult(`❌ Summarizer API failed: ${error.message}`, "error");
        }
      }

      // Auto-run test on page load
      window.addEventListener("load", () => {
        setTimeout(testChromeAI, 1000);
      });
    </script>
  </body>
</html>
